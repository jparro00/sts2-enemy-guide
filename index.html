<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS2 Enemy Reference</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a12;
    color: #e0ddd4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 24px 16px 8px;
    border-bottom: 1px solid #2a2a3a;
  }
  header h1 {
    font-size: 1.6rem;
    letter-spacing: 2px;
    color: #c8b06a;
    text-transform: uppercase;
  }
  header p { font-size: 0.8rem; color: #666; margin-top: 4px; }

  /* ── Act Selector ── */
  .act-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 20px 16px 12px;
    flex-wrap: wrap;
  }
  .act-card {
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    z-index: 60;
    overflow: hidden;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .act-card:hover { transform: translateY(-3px); filter: brightness(1.15); }
  .act-card.selected { border-color: #c8b06a; box-shadow: 0 0 20px rgba(200,176,106,0.25); }
  .act-card img {
    display: block;
    width: 200px;
    height: auto;
    border-radius: 10px;
  }
  .act-card .act-text {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(60,60,70,0.55);
    padding: 8px 0;
  }
  .act-card .act-label {
    font-size: 0.7rem;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.5px;
    color: #8ab4d6;
  }
  .act-card .act-name {
    font-size: 1.3rem;
    font-weight: 700;
    font-style: italic;
    color: #e8c84a;
    margin-top: -1px;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .act-overgrowth { border-color: #2a5a2a; }
  .act-underdocks { border-color: #1a3a5a; }
  .act-hive { border-color: #5a3a1a; }
  .act-glory { border-color: #3a1a5a; }

  /* ── Category Tabs ── */
  .category-tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 8px 16px;
    border-bottom: 1px solid #1a1a2a;
  }
  .cat-tab {
    padding: 10px 28px;
    cursor: pointer;
    z-index: 60;
    position: relative;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .cat-tab:hover { color: #aaa; }
  .cat-tab.active { color: #c8b06a; border-bottom-color: #c8b06a; }
  .cat-tab[data-cat="easy"].active { color: #6abf69; border-bottom-color: #6abf69; }
  .cat-tab[data-cat="hard"].active { color: #d4a843; border-bottom-color: #d4a843; }
  .cat-tab[data-cat="elite"].active { color: #d46a6a; border-bottom-color: #d46a6a; }
  .cat-tab[data-cat="boss"].active { color: #b06ad4; border-bottom-color: #b06ad4; }

  /* ── Enemy Grid ── */
  .enemy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    padding: 24px 32px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .enemy-card {
    background: #14141f;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid #1e1e2e;
    transition: all 0.2s;
    position: relative;
    z-index: 60;
  }
  .enemy-card:hover {
    border-color: #444;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .enemy-thumb {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    position: relative;
  }
  .enemy-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }
  .enemy-thumb img.img-top {
    object-position: top;
  }
  .enemy-thumb.multi-img {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px;
  }
  .enemy-thumb.multi-img img {
    width: auto;
    height: auto;
    border-radius: 4px;
    object-fit: contain;
  }
  .enemy-thumb.multi-img.count-2 img { width: 48%; height: 48%; }
  .enemy-thumb.multi-img.count-3 img { width: 45%; height: 45%; }
  .enemy-thumb.multi-img.count-4 img { width: 46%; height: 46%; }
  .enemy-thumb.multi-img.count-5 img { width: 30%; height: 30%; }
  .enemy-thumb.multi-img.count-6 img { width: 30%; height: 30%; }
  .enemy-card[data-cat="easy"] .enemy-thumb { background: linear-gradient(135deg, #1a2e1a, #0f1a0f); }
  .enemy-card[data-cat="hard"] .enemy-thumb { background: linear-gradient(135deg, #2e2a1a, #1a150d); }
  .enemy-card[data-cat="elite"] .enemy-thumb { background: linear-gradient(135deg, #2e1a1a, #1a0d0d); }
  .enemy-card[data-cat="boss"] .enemy-thumb { background: linear-gradient(135deg, #251a2e, #150d1a); }
  .enemy-name {
    padding: 8px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .enemy-card .multi-badge {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.65);
    color: #c8b06a;
    padding: 4px 0;
    z-index: 2;
  }

  /* ── Detail Panel ── */
  .detail-overlay {
    display: none;
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 520px;
    max-width: 92vw;
    background: #12121c;
    border-left: 1px solid #2a2a3a;
    z-index: 100;
    overflow-y: auto;
    box-shadow: -10px 0 40px rgba(0,0,0,0.6);
    animation: slideIn 0.2s ease-out;
  }
  .detail-overlay.open { display: block; }
  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid #1e1e2e;
    position: sticky;
    top: 0;
    background: #12121c;
    z-index: 1;
  }
  .detail-header h2 { font-size: 1.5rem; color: #c8b06a; }
  .detail-close {
    background: none;
    border: none;
    color: #666;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 4px 8px;
  }
  .detail-close:hover { color: #fff; }
  .detail-body { padding: 20px 24px; }
  .detail-body .hp-bar {
    display: inline-block;
    background: #2a1a1a;
    border: 1px solid #5a2a2a;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 1rem;
    color: #e66;
    margin-bottom: 16px;
  }
  .detail-body h3 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin: 16px 0 8px;
  }
  .detail-body table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
  }
  .detail-body th {
    text-align: left;
    padding: 8px 12px;
    background: #1a1a28;
    color: #999;
    font-weight: 600;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .detail-body td {
    padding: 10px 12px;
    border-bottom: 1px solid #1a1a28;
    vertical-align: top;
  }
  .detail-body tr:hover td { background: #161620; }
  .detail-body .pattern-text {
    font-size: 0.95rem;
    line-height: 1.6;
    color: #aaa;
    background: #16161f;
    padding: 12px;
    border-radius: 8px;
    border-left: 3px solid #c8b06a;
  }
  .detail-body .notes {
    font-size: 0.9rem;
    color: #888;
    font-style: italic;
    margin-top: 12px;
    padding: 10px;
    background: #14141c;
    border-radius: 6px;
  }

  /* ── Intent Icons ── */
  .intent-icons {
    display: inline-flex;
    gap: 3px;
    vertical-align: middle;
    cursor: default;
  }
  .intent-icon {
    display: inline-block;
    width: 32px;
    height: 32px;
    cursor: default;
    user-select: none;
  }
  .intent-icon img {
    width: 32px;
    height: 32px;
    vertical-align: middle;
  }
  .intent-multi_attack {
    display: inline-flex;
    align-items: center;
    width: auto;
    gap: 2px;
  }
  .intent-multi_attack img {
    width: 26px;
    height: 26px;
  }

  /* ── Enemy separator in detail panel ── */
  .enemy-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #2a2a3a;
  }
  .enemy-section:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .enemy-section-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .enemy-section-info { flex: 1; }
  .enemy-section-img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #2a2a3a;
    flex-shrink: 0;
  }
  .enemy-section-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: #c8b06a;
    margin-bottom: 8px;
  }

  /* ── Backdrop ── */
  .backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    z-index: 50;
  }
  .backdrop.open { display: block; }

  .section-label {
    text-align: center;
    padding: 16px;
    color: #555;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ── Search Bar ── */
  .search-bar {
    margin-top: 12px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
    z-index: 60;
  }
  .search-clear {
    display: none;
    position: absolute;
    right: -48px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: #6a2020;
    border: none;
    border-radius: 6px;
    color: #ff8888;
    font-size: 1.3rem;
    line-height: 40px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
    padding: 0;
  }
  .search-clear:hover { background: #8b2020; color: #ffaaaa; }
  .search-clear.visible { display: block; }
  .search-bar input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a3a;
    background: #14141f;
    color: #e0ddd4;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus {
    border-color: #c8b06a;
  }
  .search-bar input::placeholder {
    color: #555;
  }
  .search-results {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 32px 24px;
  }
  .search-results .search-zone-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #666;
    padding: 16px 0 8px;
    border-bottom: 1px solid #1a1a2a;
    margin-bottom: 12px;
  }
  .search-results .search-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }

  /* ── Category Group Headers ── */
  .cat-group-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #666;
    padding: 16px 0 8px;
    border-bottom: 1px solid #1a1a2a;
    margin-bottom: 12px;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 32px;
    padding-right: 32px;
  }
  .cat-group-label.cat-easy { color: #6abf69; border-bottom-color: #2a4a2a; }
  .cat-group-label.cat-hard { color: #d4a843; border-bottom-color: #4a3a1a; }
  .cat-group-label.cat-elite { color: #d46a6a; border-bottom-color: #4a1a1a; }
  .cat-group-label.cat-boss { color: #b06ad4; border-bottom-color: #3a1a4a; }

  /* ── Loading state ── */
  .loading {
    text-align: center;
    padding: 60px;
    color: #666;
    font-size: 1rem;
  }

  @media (max-width: 600px) {
    .act-card img { width: 150px; }
    .enemy-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 16px; }
    .detail-overlay { width: 100vw; }
  }
</style>
</head>
<body>

<header>
  <h1>Slay the Spire 2 — Enemy Reference</h1>
  <p>Click an act &rarr; tap an encounter for details</p>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search enemies or encounters..." oninput="onSearch(this.value)" />
    <button class="search-clear" id="search-clear" onclick="clearSearch()">&times;</button>
  </div>
</header>

<div id="search-results" class="search-results" style="display:none;"></div>

<div class="act-bar">
  <div class="act-card act-overgrowth selected" data-act="overgrowth" onclick="selectAct('overgrowth')">
    <img src="data/media/ui/map_top_overgrowth.png" alt="Overgrowth">
    <div class="act-text"><div class="act-label">Act 1</div><div class="act-name">Overgrowth</div></div>
  </div>
  <div class="act-card act-underdocks" data-act="underdocks" onclick="selectAct('underdocks')">
    <img src="data/media/ui/map_top_underdocks.png" alt="Underdocks">
    <div class="act-text"><div class="act-label">Act 1</div><div class="act-name">Underdocks</div></div>
  </div>
  <div class="act-card act-hive" data-act="hive" onclick="selectAct('hive')">
    <img src="data/media/ui/map_top_hive.png" alt="Hive">
    <div class="act-text"><div class="act-label">Act 2</div><div class="act-name">Hive</div></div>
  </div>
  <div class="act-card act-glory" data-act="glory" onclick="selectAct('glory')">
    <img src="data/media/ui/map_top_glory.png" alt="Glory">
    <div class="act-text"><div class="act-label">Act 3</div><div class="act-name">Glory</div></div>
  </div>
</div>

<div class="category-tabs">
  <div class="cat-tab active" data-cat="all" onclick="selectCat('all')">All</div>
  <div class="cat-tab" data-cat="easy" onclick="selectCat('easy')">Easy</div>
  <div class="cat-tab" data-cat="hard" onclick="selectCat('hard')">Hard</div>
  <div class="cat-tab" data-cat="elite" onclick="selectCat('elite')">Elite</div>
  <div class="cat-tab" data-cat="boss" onclick="selectCat('boss')">Boss</div>
</div>

<div class="section-label" id="section-label">Act 1: Overgrowth — All Encounters</div>
<div class="enemy-grid" id="enemy-grid"><div class="loading">Loading data...</div></div>

<div class="backdrop" id="backdrop" onclick="closeDetail()"></div>
<div class="detail-overlay" id="detail-panel">
  <div class="detail-header">
    <h2 id="detail-name">Enemy Name</h2>
    <button class="detail-close" onclick="closeDetail()">&#10005;</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
// ══════════════════════════════════════════
// CSV PARSER
// ══════════════════════════════════════════

function parseCSV(text) {
  // Split into logical lines, respecting quoted fields that span multiple lines
  function splitLogicalLines(text) {
    const lines = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuotes) {
        if (ch === '"' && text[i + 1] === '"') {
          current += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          current += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
          current += ch;
        } else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          if (current.trim()) lines.push(current);
          current = '';
          continue;
        } else {
          current += ch;
        }
      }
    }
    if (current.trim()) lines.push(current);
    return lines;
  }

  function parseLine(line) {
    const fields = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"' && line[i + 1] === '"') {
          current += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          current += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          fields.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
    }
    fields.push(current.trim());
    return fields;
  }

  const lines = splitLogicalLines(text);
  if (lines.length === 0) return [];

  const headers = parseLine(lines[0]);
  return lines.slice(1).map(line => {
    const values = parseLine(line);
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  });
}

// ══════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════

let enemyDatabase = {};
let encounters = {};

async function loadData() {
  const bust = '?v=' + Date.now();
  const [enemiesText, movesText, encountersText] = await Promise.all([
    fetch('data/enemies.csv' + bust).then(r => r.text()),
    fetch('data/moves.csv' + bust).then(r => r.text()),
    fetch('data/encounters.csv' + bust).then(r => r.text()),
  ]);

  const enemiesRaw = parseCSV(enemiesText);
  const movesRaw = parseCSV(movesText);
  const encountersRaw = parseCSV(encountersText);

  // Build enemy database
  for (const e of enemiesRaw) {
    enemyDatabase[e.Name] = {
      hp: e.HP,
      pattern: e.Pattern,
      notes: e.Notes,
      moves: []
    };
  }

  for (const m of movesRaw) {
    if (enemyDatabase[m.Enemy]) {
      enemyDatabase[m.Enemy].moves.push({
        name: m.Move,
        effects: m.Effects,
        intent: m.Intent
      });
    }
  }

  // Build encounters structure
  const zoneMap = { Overgrowth: 'overgrowth', Underdocks: 'underdocks', Hive: 'hive', Glory: 'glory' };
  for (const enc of encountersRaw) {
    const zoneKey = zoneMap[enc.Zone] || enc.Zone.toLowerCase();
    const cat = enc.Category;
    if (!encounters[zoneKey]) encounters[zoneKey] = {};
    if (!encounters[zoneKey][cat]) encounters[zoneKey][cat] = [];

    const enemyList = enc.Enemies ? enc.Enemies.split(';').map(e => e.trim()).filter(Boolean) : [];

    encounters[zoneKey][cat].push({
      name: enc.Encounter,
      enemies: enemyList,
      multi: enc.Multi || '',
      emoji: enc.Emoji || '',
      image: enc.Image || ''
    });
  }

  render();
}

// ══════════════════════════════════════════
// IMAGE RESOLUTION
// ══════════════════════════════════════════

// Cache-busting version for images
const imgV = Date.now();

// Encounters where the image should align to top instead of center
const topAlignEncounters = new Set(['Kaiser Crab']);

// Elites/bosses that should still render as multi-enemy images
const forceMultiEncounters = new Set(['Phantasmal Gardeners', 'Knights']);

// Try media/encounters/ first, then media/enemies/, then emoji fallback
function getEncounterImageHtml(enc, cat) {
  // If encounter has multiple enemies, show individual enemy images (skip for elites/bosses unless forced)
  const isMultiEligible = cat !== 'elite' && cat !== 'boss' || forceMultiEncounters.has(enc.name);
  if (enc.enemies && enc.enemies.length > 1 && isMultiEligible) {
    const count = enc.enemies.length;
    const imgs = enc.enemies.map(name => {
      const src = `data/media/enemies/${name}.png?v=${imgV}`;
      return `<img src="${src}" alt="${name}" onerror="this.style.display='none'">`;
    }).join('');
    return { multi: true, count, html: imgs };
  }

  const topClass = topAlignEncounters.has(enc.name) ? ' img-top' : '';

  if (enc.image) {
    // Image filename specified in CSV — try encounters folder first, enemies fallback
    const encSrc = `data/media/encounters/${enc.image}?v=${imgV}`;
    const enemySrc = `data/media/enemies/${enc.image}?v=${imgV}`;
    return { multi: false, html: `<img class="${topClass}" src="${encSrc}" alt="${enc.name}" onerror="this.onerror=null; this.src='${enemySrc}';" onload="" data-fallback="${enemySrc}">` };
  }

  // No image specified — try encounter name as filename
  const encSrc = `data/media/encounters/${enc.name}.png?v=${imgV}`;
  const enemySrc = `data/media/enemies/${enc.name}.png?v=${imgV}`;
  return { multi: false, html: `<img class="${topClass}" src="${encSrc}" alt="${enc.name}" onerror="if(this.dataset.tried){this.style.display='none';this.parentElement.insertAdjacentHTML('afterbegin','${enc.emoji}')}else{this.dataset.tried='1';this.src='${enemySrc}'}" data-tried="">` };
}

// ══════════════════════════════════════════
// INTENT ICON MAP
// ══════════════════════════════════════════

const intentKeys = [
  "attack", "multi_attack", "block", "buff", "debuff",
  "add_statuses", "affliction", "summon", "sleeping",
  "deathblow", "escape", "heal", "stun", "unknown"
];

function intentImg(key) {
  const src = `data/media/intents/${key}.png?v=${imgV}`;
  return `<img src="${src}" alt="${key}" title="${key}">`;
}

function renderIntents(intentStr) {
  if (!intentStr) return '';
  return intentStr.split(',').map(i => {
    const key = i.trim();
    let inner;
    if (key === 'multi_attack') {
      inner = intentImg('attack') + intentImg('attack');
    } else if (intentKeys.includes(key)) {
      inner = intentImg(key);
    } else {
      inner = intentImg('unknown');
    }
    return `<span class="intent-icon intent-${key}" title="${key}">${inner}</span>`;
  }).join('');
}

// ══════════════════════════════════════════
// UI LOGIC
// ══════════════════════════════════════════

const actNames = {
  overgrowth: "Act 1: Overgrowth",
  underdocks: "Act 1: Underdocks",
  hive: "Act 2: Hive",
  glory: "Act 3: Glory",
};
const catNames = { all: "All Encounters", easy: "Easy Encounters", hard: "Hard Encounters", elite: "Elites", boss: "Bosses" };

let currentAct = "overgrowth";
let currentCat = "all";

function selectAct(act) {
  currentAct = act;
  currentCat = "all";
  document.querySelectorAll('.act-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.act-card[data-act="${act}"]`).classList.add('selected');
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.cat-tab[data-cat="all"]').classList.add('active');
  render();
}

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.cat-tab[data-cat="${cat}"]`).classList.add('active');
  render();
}

function renderCards(encs, cat) {
  return encs.map(e => {
    const img = getEncounterImageHtml(e, cat);
    const thumbClass = img.multi ? `enemy-thumb multi-img count-${img.count}` : 'enemy-thumb';
    return `
    <div class="enemy-card" data-cat="${cat}" onclick="openEncounter('${e.name.replace(/'/g, "\\'")}', '${currentAct}', '${cat}')">
      <div class="${thumbClass}">
        ${img.html}
        ${e.multi ? `<span class="multi-badge">${e.multi}</span>` : ''}
      </div>
      <div class="enemy-name">${e.name}</div>
    </div>`;
  }).join('');
}

function render() {
  const grid = document.getElementById('enemy-grid');
  const label = document.getElementById('section-label');
  label.textContent = `${actNames[currentAct]} — ${catNames[currentCat]}`;

  if (currentCat === 'all') {
    // Show all categories grouped with headers
    let html = '';
    for (const cat of ['easy', 'hard', 'elite', 'boss']) {
      const encs = encounters[currentAct]?.[cat] || [];
      if (encs.length === 0) continue;
      html += `<div class="cat-group-label cat-${cat}">${catNames[cat]}</div>`;
      html += `<div class="enemy-grid">${renderCards(encs, cat)}</div>`;
    }
    grid.innerHTML = '';
    grid.className = '';
    grid.outerHTML = `<div id="enemy-grid">${html}</div>`;
  } else {
    const encs = encounters[currentAct]?.[currentCat] || [];
    // Restore grid class if it was removed by "all" view
    const container = document.getElementById('enemy-grid');
    container.className = 'enemy-grid';
    container.innerHTML = renderCards(encs, currentCat);
  }
}

function formatMultiBadge(multi) {
  // Convert "3 enemies" → "×3", "3-4 enemies" → "3-4"
  const m = multi.match(/^(\d+(?:-\d+)?)/);
  if (m) return m[1].includes('-') ? m[1] : `×${m[1]}`;
  return multi;
}

function renderEnemySection(name) {
  const data = enemyDatabase[name];
  if (!data) return `<div class="enemy-section"><div class="enemy-section-name">${name}</div><p style="color:#666;">No data available.</p></div>`;

  const movesHtml = data.moves.map(m => `
    <tr>
      <td><span class="intent-icons">${renderIntents(m.intent)}</span></td>
      <td><strong>${m.name}</strong></td>
      <td>${m.effects.replace(/;/g, '<br>')}</td>
    </tr>
  `).join('');

  const notesHtml = data.notes ? `<div class="notes">&#9888;&#65039; ${data.notes}</div>` : '';

  const imgSrc = `data/media/enemies/${name}.png?v=${imgV}`;

  return `
    <div class="enemy-section">
      <div class="enemy-section-header">
        <div class="enemy-section-info">
          <div class="enemy-section-name">${name}</div>
          <div class="hp-bar">&#10084;&#65039; HP: ${data.hp}</div>
        </div>
        <img class="enemy-section-img" src="${imgSrc}" alt="${name}" onerror="this.style.display='none'">
      </div>

      <h3>Attack Pattern</h3>
      <div class="pattern-text">${data.pattern}</div>

      <h3>Moves</h3>
      <table>
        <tr><th style="width:40px;">Intent</th><th>Move</th><th>Effect</th></tr>
        ${movesHtml}
      </table>

      ${notesHtml}
    </div>
  `;
}

function openEncounter(encounterName, act, cat) {
  const searchAct = act || currentAct;
  const searchCat = cat || currentCat;
  const panel = document.getElementById('detail-panel');
  const backdrop = document.getElementById('backdrop');
  document.getElementById('detail-name').textContent = encounterName;

  // Search all categories if act/cat provided, otherwise use current
  let enc = null;
  if (act && cat) {
    const encs = encounters[act]?.[cat] || [];
    enc = encs.find(e => e.name === encounterName);
  } else {
    const encs = encounters[currentAct]?.[currentCat] || [];
    enc = encs.find(e => e.name === encounterName);
  }

  if (enc && enc.enemies && enc.enemies.length > 0) {
    const sections = enc.enemies
      .filter((name, idx, arr) => arr.indexOf(name) === idx)
      .map(name => renderEnemySection(name))
      .join('');
    document.getElementById('detail-body').innerHTML = sections;
  } else {
    document.getElementById('detail-body').innerHTML = renderEnemySection(encounterName);
  }

  panel.classList.add('open');
  backdrop.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeDetail();
    const input = document.getElementById('search-input');
    if (input.value) { input.value = ''; onSearch(''); }
  }
});

// ══════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════

function getBrowseElements() {
  return [
    document.querySelector('.act-bar'),
    document.querySelector('.category-tabs'),
    document.getElementById('section-label'),
    document.getElementById('enemy-grid'),
  ];
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  onSearch('');
  input.focus();
}

function onSearch(query) {
  const results = document.getElementById('search-results');
  const clearBtn = document.getElementById('search-clear');
  const q = query.trim().toLowerCase();
  clearBtn.classList.toggle('visible', q.length > 0);

  if (!q) {
    results.style.display = 'none';
    getBrowseElements().forEach(el => { if (el) el.style.display = ''; });
    return;
  }

  // Hide browse UI, show search results
  getBrowseElements().forEach(el => { if (el) el.style.display = 'none'; });
  results.style.display = 'block';

  // Search all encounters across all acts/categories
  const matches = [];
  const zoneOrder = ['overgrowth', 'underdocks', 'hive', 'glory'];

  for (const zone of zoneOrder) {
    for (const cat of ['easy', 'hard', 'elite', 'boss']) {
      const encs = encounters[zone]?.[cat] || [];
      for (const enc of encs) {
        const nameMatch = enc.name.toLowerCase().includes(q);
        const enemyMatch = enc.enemies.some(e => e.toLowerCase().includes(q));
        if (nameMatch || enemyMatch) {
          matches.push({ enc, zone, cat });
        }
      }
    }
  }

  if (matches.length === 0) {
    results.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">No matches found.</div>';
    return;
  }

  // Group by zone
  const grouped = {};
  for (const m of matches) {
    const key = m.zone;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(m);
  }

  let html = '';
  for (const zone of zoneOrder) {
    if (!grouped[zone]) continue;
    html += `<div class="search-zone-label">${actNames[zone]}</div>`;
    html += '<div class="search-grid">';
    for (const { enc, cat } of grouped[zone]) {
      const img = getEncounterImageHtml(enc, cat);
      const thumbClass = img.multi ? `enemy-thumb multi-img count-${img.count}` : 'enemy-thumb';
      html += `
        <div class="enemy-card" data-cat="${cat}" onclick="openEncounter('${enc.name.replace(/'/g, "\\'")}', '${zone}', '${cat}')">
          <div class="${thumbClass}">
            ${img.html}
            ${enc.multi ? `<span class="multi-badge">${enc.multi}</span>` : ''}
          </div>
          <div class="enemy-name">${enc.name}</div>
        </div>`;
    }
    html += '</div>';
  }

  results.innerHTML = html;
}

// ── Load and go ──
loadData();
</script>
