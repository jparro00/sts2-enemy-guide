name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - beta-*
      - test

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: main-site

      - name: Force isBeta false on master
        run: |
          jq '.isBeta = false' main-site/site-config.json > tmp.json && mv tmp.json main-site/site-config.json

      - name: Validate master config
        run: |
          if jq -e '.isBeta == true' main-site/site-config.json > /dev/null 2>&1; then
            echo "ERROR: isBeta must not be true on master"
            exit 1
          fi

      - name: Start site from master
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='raw' --exclude='__pycache__' --exclude='*.py' --exclude='*.bat' --exclude='*.xlsx' main-site/ _site/

      - name: Find extra branches
        id: extra
        run: |
          cd main-site
          EXTRA_BRANCHES=$(git ls-remote --heads origin 'refs/heads/beta-*' 'refs/heads/test' | awk '{print $2}' | sed 's|refs/heads/||')
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$EXTRA_BRANCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found extra branches: $EXTRA_BRANCHES"

      - name: Checkout and copy extra branches
        run: |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "Processing branch: $branch"
            # Derive folder name: beta-* -> beta, test -> test
            if [[ "$branch" == beta-* ]]; then
              FOLDER="beta"
            else
              FOLDER="$branch"
            fi
            git clone --depth 1 --branch "$branch" https://github.com/${{ github.repository }}.git "checkout-${FOLDER}" || continue
            mkdir -p "_site/${FOLDER}"
            rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='raw' --exclude='__pycache__' --exclude='*.py' --exclude='*.bat' --exclude='*.xlsx' "checkout-${FOLDER}/" "_site/${FOLDER}/"
            # Force isBeta true on non-master deployments
            if [ -f "_site/${FOLDER}/site-config.json" ]; then
              jq '.isBeta = true' "_site/${FOLDER}/site-config.json" > tmp.json && mv tmp.json "_site/${FOLDER}/site-config.json"
            fi
            rm -rf "checkout-${FOLDER}"
            echo "Deployed $branch to /${FOLDER}/"
          done <<< "${{ steps.extra.outputs.branches }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
