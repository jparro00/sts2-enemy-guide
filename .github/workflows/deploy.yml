name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - beta-*
      - test

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: main-site

      - name: Force isBeta false on master
        run: |
          jq '.isBeta = false | .siteBase = "" | .noindex = false' main-site/site-config.json > tmp.json && mv tmp.json main-site/site-config.json

      - name: Validate master config
        run: |
          if jq -e '.isBeta == true' main-site/site-config.json > /dev/null 2>&1; then
            echo "ERROR: isBeta must not be true on master"
            exit 1
          fi

      - name: Resize media for master
        run: |
          if [ -f main-site/build_thumbs.py ]; then
            cd main-site && python build_thumbs.py
          else
            echo "build_thumbs.py not present on master — skipping thumb generation"
          fi

      - name: Generate snapshots for master
        run: |
          # Node build (single renderer shared with the SPA); python fallback
          # for branches that predate the .mjs migration.
          if [ -f main-site/build_snapshots.mjs ]; then
            cd main-site && node build_snapshots.mjs
          elif [ -f main-site/build_snapshots.py ]; then
            cd main-site && python build_snapshots.py
          else
            echo "no snapshot build script on master — skipping snapshot generation"
          fi

      - name: Start site from master
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='raw' --exclude='__pycache__' --exclude='*.py' --exclude='*.mjs' --exclude='*.bat' --exclude='*.xlsx' main-site/ _site/

      - name: Find extra branches
        id: extra
        run: |
          cd main-site
          # Only the highest-version beta-* branch deploys to /beta/; retired beta branches are ignored.
          LATEST_BETA=$(git ls-remote --heads origin 'refs/heads/beta-*' | awk '{print $2}' | sed 's|refs/heads/||' | sort -V | tail -1)
          TEST_BRANCH=$(git ls-remote --heads origin 'refs/heads/test' | awk '{print $2}' | sed 's|refs/heads/||')
          EXTRA_BRANCHES=$(printf '%s\n%s\n' "$LATEST_BETA" "$TEST_BRANCH" | sed '/^$/d')
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$EXTRA_BRANCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found extra branches: $EXTRA_BRANCHES"

      - name: Checkout and copy extra branches
        run: |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "Processing branch: $branch"
            # Derive folder name: beta-* -> beta, others use branch name
            if [[ "$branch" == beta-* ]]; then
              FOLDER="beta"
            else
              FOLDER="$branch"
            fi
            # Fail the deploy on clone failure — silently skipping would ship
            # the site with /beta/ or /test/ missing or stale.
            git clone --depth 1 --branch "$branch" https://github.com/${{ github.repository }}.git "checkout-${FOLDER}" || { echo "ERROR: failed to clone $branch"; exit 1; }
            # Beta is crawlable (canonicals point to master for shared content); test stays noindex'd.
            if [[ "$FOLDER" == "beta" ]]; then
              NOINDEX="false"
            else
              NOINDEX="true"
            fi
            # Set branch-specific config: isBeta, noindex, siteBase
            if [ -f "checkout-${FOLDER}/site-config.json" ]; then
              jq --arg base "/${FOLDER}" --argjson noindex "$NOINDEX" '.isBeta = true | .noindex = $noindex | .siteBase = $base' \
                "checkout-${FOLDER}/site-config.json" > tmp.json && mv tmp.json "checkout-${FOLDER}/site-config.json"
            fi
            # Copy master's data/ into the beta checkout as master-data/ so the snapshot
            # build can set canonical tags to master URLs for entities that exist on both branches.
            if [[ "$FOLDER" == "beta" ]] && [ -d "main-site/data" ]; then
              cp -r main-site/data "checkout-${FOLDER}/master-data"
            fi
            # Resize media inside the branch checkout (if script present)
            if [ -f "checkout-${FOLDER}/build_thumbs.py" ]; then
              (cd "checkout-${FOLDER}" && python build_thumbs.py)
            else
              echo "build_thumbs.py not present on $branch — skipping thumb generation"
            fi
            # Generate snapshots inside the branch checkout (if build script present).
            # Node build preferred; python fallback for pre-migration branches.
            if [ -f "checkout-${FOLDER}/build_snapshots.mjs" ]; then
              (cd "checkout-${FOLDER}" && node build_snapshots.mjs)
            elif [ -f "checkout-${FOLDER}/build_snapshots.py" ]; then
              (cd "checkout-${FOLDER}" && python build_snapshots.py)
            else
              echo "no snapshot build script on $branch — skipping snapshot generation"
            fi
            mkdir -p "_site/${FOLDER}"
            rsync -a --delete --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='raw' --exclude='__pycache__' --exclude='*.py' --exclude='*.mjs' --exclude='*.bat' --exclude='*.xlsx' "checkout-${FOLDER}/" "_site/${FOLDER}/"
            rm -rf "checkout-${FOLDER}"
            echo "Deployed $branch to /${FOLDER}/"
          done <<< "${{ steps.extra.outputs.branches }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
