name: Data Feedback
description: Report an inaccuracy or suggest an update
labels: ["feedback"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Enemy attack pattern
        - Enemy stats (HP, powers)
        - Event choices or effects
        - Missing enemy or event
        - Other
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Enemy or Event Name
      placeholder: e.g. Cubex Construct, Potion Courier
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What's wrong or what should change?
      placeholder: Describe the issue and what you think the correct data should be.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game Version (if known)
      placeholder: e.g. v0.99.1
