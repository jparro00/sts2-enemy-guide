name: Enemy or Encounter Issue
description: Report an issue with enemy stats, attack patterns, or encounter data
labels: ["enemies"]
body:
  - type: input
    id: name
    attributes:
      label: Enemy or Encounter Name
      placeholder: e.g. Cubex Construct, Ruby Raiders
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What's wrong or what should change?
      placeholder: Describe the issue and what you think the correct data should be.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game Version (if known)
      placeholder: e.g. v0.99.1
